services:
  app:
    # 镜像由 GitHub Actions 构建并推送，服务器只拉取运行，绝不本地编译
    image: ghcr.io/image1005/moji-xinglv:latest
    container_name: moji-xinglv
    restart: unless-stopped
    ports:
      - "3000:3000"
    # .env 只存在于服务器，不进仓库；全部变量注入容器，避免白名单漏项
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=file:/app/data/app.db
    volumes:
      - /opt/moji-xinglv/data:/app/data
