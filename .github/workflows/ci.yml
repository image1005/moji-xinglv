name: 山海行笺检查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SECRET: ci-only-dummy-auth-secret-not-for-production-2026
      BETTER_AUTH_URL: http://localhost:3000
      DATABASE_URL: file:./data/ci.db
      AI_API_KEY: ''
      AI_BASE_URL: http://127.0.0.1:9/v1
      AI_MODEL: ci-dummy-model
      BAIDU_MAP_AK: ''
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'
      - name: 按锁文件安装依赖
        run: bun install --frozen-lockfile
      - name: 执行代码检查、类型检查与测试
        run: bun run check
      - name: 构建生产产物
        run: bun run build
