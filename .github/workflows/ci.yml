name: 山海行笺检查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTH_SECRET: ci-only-dummy-auth-secret-not-for-production-2026
      BETTER_AUTH_URL: http://localhost:3000
      DATABASE_URL: file:./data/ci.db
      AI_API_KEY: ''
      AI_BASE_URL: http://127.0.0.1:9/v1
      AI_MODEL: ci-dummy-model
      BAIDU_MAP_AK: ''
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4'
      - name: 按锁文件安装依赖
        run: bun install --frozen-lockfile
      - name: 执行代码、类型、测试与 Knip 全量和生产入口检查
        run: bun run check
      - name: 构建生产产物
        run: bun run build
      - name: 隔离数据库 HTTP 验收
        run: bun run test:integration
      - name: 真实进程退出与同库恢复验收
        run: bun run test:recovery
      - name: 安装浏览器验收所需 Chromium
        run: bunx playwright install --with-deps chromium
      - name: 本地模拟 AI 浏览器验收
        run: bun run test:browser
      - name: 保存浏览器报告和截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            .verification/browser
            .verification/recovery
          if-no-files-found: ignore
