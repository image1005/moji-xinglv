name: 生产环境自动部署

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签与标签元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: 构建镜像并推送到 GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 服务器拉取镜像并启动
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 远程拉取镜像、滚动重启与健康检查
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script_stop: true
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            echo "=== 开始部署：仅拉取镜像，服务器不参与编译 ==="
            mkdir -p /opt/moji-xinglv/data
            cd /opt/moji-xinglv

            if [ ! -f ".env" ]; then
              echo "::error::服务器缺少 /opt/moji-xinglv/.env，该文件不进仓库，需单独维护"
              exit 1
            fi

            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/image1005/moji-xinglv.git || git remote set-url origin https://github.com/image1005/moji-xinglv.git
            fi

            echo ">>> 同步仓库文件（.env 被 gitignore，不会被覆盖）..."
            git fetch origin main
            git reset --hard origin/main

            echo ">>> 登录 GHCR 并拉取镜像..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            docker compose pull
            docker compose up -d --no-build
            docker logout ghcr.io >/dev/null 2>&1 || true

            echo ">>> 等待服务就绪..."
            for i in $(seq 1 20); do
              if wget -q -O /dev/null http://127.0.0.1:3000/ 2>/dev/null; then
                echo ">>> 服务已就绪（第 ${i} 次探测）"
                break
              fi
              sleep 3
            done

            if ! wget -q -O /dev/null http://127.0.0.1:3000/ 2>/dev/null; then
              echo "::error::健康检查失败"
              docker logs moji-xinglv --tail 60
              exit 1
            fi

            echo ">>> 清理悬空镜像..."
            docker image prune -f >/dev/null 2>&1 || true

            docker ps --filter "name=moji-xinglv"
            echo "=== 部署成功 ==="
