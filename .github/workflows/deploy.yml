name: 生产环境自动部署

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 远程 Docker 自动部署
    runs-on: ubuntu-latest
    steps:
      - name: 连接远程服务器并执行 Docker 编排更新
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            echo "=== 开始自动化部署流程 ==="
            mkdir -p /opt/moji-xinglv/data

            if [ -d "/opt/moji-xinglv/.git" ]; then
              echo ">>> 拉取最新仓库代码..."
              cd /opt/moji-xinglv
              git fetch origin main
              git reset --hard origin/main
            else
              echo ">>> 首次克隆项目仓库..."
              git clone https://github.com/image1005/moji-xinglv.git /opt/moji-xinglv
              cd /opt/moji-xinglv
            fi

            if [ ! -f "/opt/moji-xinglv/.env" ]; then
              echo ">>> 生成默认 .env 配置文件..."
              cp /opt/moji-xinglv/.env.example /opt/moji-xinglv/.env
            fi

            echo ">>> 执行 Docker 构建与启动..."
            docker compose down || true
            docker compose up -d --build

            echo ">>> 检查容器运行状态..."
            sleep 3
            docker ps --filter "name=moji-xinglv"
            echo "=== 部署流程已成功执行 ==="
